name: Daily calendar event digest checks

on:
  pull_request:
    paths:
      - 'app/Console/Commands/SendTeamCelebrationsNotification.php'
      - 'app/Services/Calendar/TeamCelebrationService.php'
      - 'tests/Feature/TeamCelebrationsNotificationTest.php'
      - 'tests/Feature/TeamCelebrationServiceTest.php'
      - '.github/workflows/calendar-celebrations.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_URL: ''
      DB_ANALYTICS_DATABASE: ':memory:'
      DB_OLD_DATABASE: ':memory:'
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, pdo_sqlite, sqlite3, gd, intl, zip
          coverage: none
          tools: composer:v2
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
      - name: Calendar notification and celebration tests
        run: php artisan test tests/Feature/TeamCelebrationsNotificationTest.php tests/Feature/TeamCelebrationServiceTest.php tests/Feature/CalendarEventsServiceTest.php
      - name: Verify OKS copy unchanged
        run: php artisan test tests/Feature/OksControlCopyTest.php
