name: Focus Control V2 checks

on:
  push:
    branches:
      - main
      - 'codex/focus-control-v2-foundation'
    paths:
      - 'app/Http/Controllers/FocusV2*.php'
      - 'app/Http/Middleware/EnsureFocusV2PreviewEnabled.php'
      - 'config/focus-v2.php'
      - 'app/Models/FocusV2*.php'
      - 'app/Services/Controls/**'
      - 'app/Console/Commands/PruneFocusV2MediaUploads.php'
      - 'app/Console/Commands/FocusV2StagingCheck.php'
      - 'database/migrations/*focus_v2*'
      - 'resources/js/focus-v2/**'
      - 'resources/views/focus-v2.blade.php'
      - 'resources/views/components/profile/**'
      - 'resources/views/components/⚡page-checks.blade.php'
      - 'routes/web.php'
      - 'package.json'
      - 'package-lock.json'
      - 'phpunit.xml'
      - 'vite.config.js'
      - 'tests/Feature/ControlWorkflowTest.php'
      - 'tests/Feature/FocusV2StagingCheckTest.php'
      - 'tests/JavaScript/FocusV2*.test.mjs'
      - 'tests/Browser/**'
      - 'focus-v2-browser-smoke.html'
      - 'docs/focus-v2-production-rollout.md'
      - '.github/workflows/focus-v2.yml'
  pull_request:
    paths:
      - 'app/Http/Controllers/FocusV2*.php'
      - 'app/Http/Middleware/EnsureFocusV2PreviewEnabled.php'
      - 'config/focus-v2.php'
      - 'app/Models/FocusV2*.php'
      - 'app/Services/Controls/**'
      - 'app/Console/Commands/PruneFocusV2MediaUploads.php'
      - 'app/Console/Commands/FocusV2StagingCheck.php'
      - 'database/migrations/*focus_v2*'
      - 'resources/js/focus-v2/**'
      - 'resources/views/focus-v2.blade.php'
      - 'resources/views/components/profile/**'
      - 'resources/views/components/⚡page-checks.blade.php'
      - 'routes/web.php'
      - 'package.json'
      - 'package-lock.json'
      - 'phpunit.xml'
      - 'vite.config.js'
      - 'tests/Feature/ControlWorkflowTest.php'
      - 'tests/Feature/FocusV2StagingCheckTest.php'
      - 'tests/JavaScript/FocusV2*.test.mjs'
      - 'tests/Browser/**'
      - 'focus-v2-browser-smoke.html'
      - 'docs/focus-v2-production-rollout.md'
      - '.github/workflows/focus-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Vue build and isolated Laravel tests
    # Playwright 1.56 targets 24.04; ubuntu-latest is already 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_URL: ''
      DB_ANALYTICS_DATABASE: ':memory:'
      DB_OLD_DATABASE: ':memory:'
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      PULSE_ENABLED: 'false'
      TELESCOPE_ENABLED: 'false'
      NIGHTWATCH_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, pdo_sqlite, sqlite3, gd, intl, zip
          coverage: none
          tools: composer:v2
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate reproducible frontend install
        run: npm ci
      - name: Focus V2 JavaScript retry regression tests
        run: node --test tests/JavaScript/FocusV2MediaRetry.test.mjs tests/JavaScript/FocusV2LocalRecovery.test.mjs tests/JavaScript/FocusV2Transport.test.mjs tests/JavaScript/FocusV2PhotoCache.test.mjs
      - name: Build Vue and existing assets
        run: npm run build
      - name: Browser smoke — real Vue component in mobile Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          node tests/Browser/focus-v2-smoke.mjs
      - name: Prepare isolated test application
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
      - name: Focus control feature and media regression tests
        run: php artisan test tests/Feature/ControlWorkflowTest.php tests/Feature/FocusV2StagingCheckTest.php
      - name: Package compiled assets for deployment
        uses: actions/upload-artifact@v4
        with:
          name: focus-v2-vite-build
          path: public/build/
          if-no-files-found: error
          retention-days: 7
