name: OKS copy checks

on:
  pull_request:
    paths:
      - 'app/Services/Telegram/OksControlSchedule.php'
      - 'app/Services/Telegram/TelegramScheduledMessageDeliveryService.php'
      - 'app/Services/Telegram/TelegramOksControlCards.php'
      - 'tests/Feature/OksControlCopyTest.php'
      - 'tests/Feature/TelegramScheduledMessagesTest.php'
      - '.github/workflows/oks-copy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: testing
      TELEGRAM_BOT_TOKEN: test-work-token
      TELEGRAM_SCHEDULED_BOT_TOKEN: test-scheduled-token
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_URL: ''
      DB_ANALYTICS_DATABASE: ':memory:'
      DB_OLD_DATABASE: ':memory:'
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, pdo_sqlite, sqlite3, gd, intl, zip
          coverage: none
          tools: composer:v2
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend assets
        run: npm run build
      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
      - name: Verify revised OKS questions and compatibility
        run: php artisan test tests/Feature/OksControlCopyTest.php
      - name: Verify OKS schedule and Telegram delivery regressions
        run: php artisan test tests/Feature/TelegramScheduledMessagesTest.php --filter='(?i)oks'
      - name: Verify Work webhook regressions
        run: php artisan test tests/Feature/TelegramWorkWebhookTest.php
